workflows:
  ios-unsigned-build:
    name: GuitarCoach iOS unsigned build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        PROJECT: "$CM_BUILD_DIR/GuitarCoach/GuitarCoach.xcodeproj"
        SCHEME: "GuitarCoach"
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen || true
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR/GuitarCoach"
          xcodegen generate --spec project.yml
      - name: Build unsigned archive
        script: |
          set -e
          rm -rf build Payload GuitarCoach.ipa
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/GuitarCoach.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package IPA
        script: |
          set -e
          rm -rf Payload GuitarCoach.ipa
          mkdir -p Payload
          cp -R "$CM_BUILD_DIR/GuitarCoach.xcarchive/Products/Applications/GuitarCoach.app" Payload/
          /usr/bin/zip -qry GuitarCoach.ipa Payload
    artifacts:
      - GuitarCoach.ipa
      - $CM_BUILD_DIR/GuitarCoach.xcarchive/dSYMs/**
