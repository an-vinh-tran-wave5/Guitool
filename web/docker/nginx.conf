# Serves the built Guitool SPA. Guitool has no backend (localStorage +
# IndexedDB only — see README), so this is deliberately just static-file
# serving plus SPA fallback routing, nothing more.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite content-hashes its JS/CSS bundle filenames, so those can be
    # cached aggressively — a new build always gets new filenames.
    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must never be cached, or a redeployed build can
    # keep serving stale asset references.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # react-router-dom client-side routing: any path that isn't a real
    # file (a hard refresh on /library/some-exercise, a bookmarked
    # /progress, etc.) falls back to index.html and the app's own router
    # takes it from there.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
