name: GuitarCoach
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: "YES"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GuitarCoach:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Features
      - path: Models
      - path: Services
    resources:
      - path: Resources/seed_exercises.json
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guitarcoach.app
        PRODUCT_NAME: GuitarCoach
        INFOPLIST_KEY_CFBundleDisplayName: GuitarCoach
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "GuitarCoach uses the microphone to detect guitar notes for the tuner."
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "GuitarCoach uses notifications to remind you to practice."
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
    scheme:
      gatherCoverageData: false
      testTargets:
        - GuitarCoachTests
  GuitarCoachTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: GuitarCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guitarcoach.tests
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
